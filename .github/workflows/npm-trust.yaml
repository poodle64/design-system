name: Configure npm Trusted Publisher

# Configures each package's OIDC trusted publisher on npmjs, so publishing needs
# no token (see publish.yaml). Run manually; it changes npm-side settings only
# and touches nothing in this repo.
#
# It exists because the npmjs web form for this is gated behind a WebAuthn
# security key, which no household operator holds. A granular access token with
# bypass-2FA does the same job unattended, which is what the token is for.
#
# Needs the NPM_TOKEN secret. That secret is DELIBERATELY temporary: once both
# packages have a trusted publisher, publishing is OIDC and nothing here or in
# publish.yaml reads a token again. Deleting the secret disables this workflow
# and nothing else — which is the intended end state, not a regression.

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Which package to configure'
        required: true
        type: choice
        options: ['@poodle64/ui', '@poodle64/design-tokens', 'both']
        default: 'both'

permissions:
  contents: read

jobs:
  trust:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@poodle64'

      # `npm trust` landed in npm 11; Node 22 bundles 10.x.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      - name: Configure trusted publisher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SELECTION: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ "$SELECTION" = "both" ]; then
            PACKAGES="@poodle64/ui @poodle64/design-tokens"
          else
            PACKAGES="$SELECTION"
          fi
          for pkg in $PACKAGES; do
            echo "::group::$pkg"
            npm trust github "$pkg" \
              --repo poodle64/design-system \
              --file publish.yaml \
              --allow-publish \
              --yes
            echo "::endgroup::"
          done

      # Reads back what npm actually stored rather than trusting the exit code —
      # the whole point is that the next release authenticates without a token.
      - name: Verify the trusted publisher is recorded
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          SELECTION: ${{ inputs.package }}
        run: |
          set -euo pipefail
          if [ "$SELECTION" = "both" ]; then
            PACKAGES="@poodle64/ui @poodle64/design-tokens"
          else
            PACKAGES="$SELECTION"
          fi
          for pkg in $PACKAGES; do
            echo "::group::$pkg"
            npm trust list "$pkg"
            echo "::endgroup::"
          done
