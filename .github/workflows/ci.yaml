name: CI

# Verifies the token build on every push/PR so Renovate PRs and token edits
# carry a real signal. GitHub-hosted for the same public-repo reason as
# publish.yaml (dated 2026-07-03).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm build

      - name: Assert emitted contract
        run: |
          set -e
          for prop in \
            --ds-radius-lg --ds-font-display --ds-font-body --ds-font-code \
            --ds-spacing-md --ds-text-2xs \
            --ds-color-status-success --ds-color-status-warning \
            --ds-color-status-error --ds-color-status-info --ds-color-status-neutral; do
            grep -q -- "$prop:" dist/tokens.css || { echo "missing $prop in dist/tokens.css" >&2; exit 1; }
          done
          # Every custom property in tokens.css must carry the --ds- namespace
          if grep -Eo '^\s*--[a-z0-9-]+:' dist/tokens.css | grep -v -- '--ds-'; then
            echo "non --ds- prefixed property found in dist/tokens.css" >&2
            exit 1
          fi
          # tokens.tw.css deliberately emits un-prefixed Tailwind namespaces;
          # every property must sit in one of them and alias a --ds- var.
          grep -q '@theme' dist/tokens.tw.css
          if grep -Eo '^\s*--[a-z0-9-]+:' dist/tokens.tw.css | grep -Ev -- '--(color|radius|spacing|text|font)-'; then
            echo "unexpected @theme namespace in dist/tokens.tw.css" >&2
            exit 1
          fi
          if grep -E '^\s*--' dist/tokens.tw.css | grep -v 'var(--ds-'; then
            echo "tokens.tw.css property not aliasing a --ds- var" >&2
            exit 1
          fi
          grep -q 'DS_COLOR_STATUS_SUCCESS' dist/tokens.js
