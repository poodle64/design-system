name: Publish Package

# Publishes one workspace package to public npm (registry.npmjs.org, the
# @poodle64 scope) on a package-scoped tag push: design-tokens-v<version> for
# @poodle64/design-tokens, ui-v<version> for @poodle64/ui. Scoped tags let
# each package release on its own cadence without forcing a version bump on
# the other (WP-51 Lane WP, 2026-07-22).
#
# Moved off GitHub Packages 2026-08-04: GitHub Packages' npm registry
# requires an authenticated request for every install, public packages
# included, so a consumer with no configured token cannot `pnpm add` these
# packages even though the repo and package are both public. Public npm
# needs no token to install.
#
# Requires the NPM_TOKEN repository secret (an npm automation token scoped
# to the @poodle64 org) — the "Require NPM_TOKEN" step below fails fast with
# a clear message if it is missing.
#
# Deviation from 10-ci-workflow-standard (jobs on [self-hosted, atlas]),
# dated 2026-07-03: this repo is PUBLIC, and exposing a self-hosted runner
# to a public repo is a fork-PR execution risk. GitHub-hosted is the
# by-exception choice here, matching the public thoth repo.

on:
  push:
    tags: ['design-tokens-v*', 'ui-v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require NPM_TOKEN
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set on this repository. An npm automation token for the @poodle64 org must be added as the NPM_TOKEN repository secret before this workflow can publish — ask the repo owner (poodle64) to add it." >&2
            exit 1
          fi

      - name: Resolve package from tag
        id: pkg
        run: |
          set -e
          case "$GITHUB_REF_NAME" in
            design-tokens-v*)
              echo "dir=packages/design-tokens" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#design-tokens-v}" >> "$GITHUB_OUTPUT"
              ;;
            ui-v*)
              echo "dir=packages/ui" >> "$GITHUB_OUTPUT"
              echo "version=${GITHUB_REF_NAME#ui-v}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unrecognised tag: $GITHUB_REF_NAME" >&2
              exit 1
              ;;
          esac

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          scope: '@poodle64'

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tag can be cut from a commit that never went through ci.yaml, so the
      # build/test guard runs here too rather than trusting the push gate.
      #
      # The trailing "..." selects the package AND its workspace dependencies,
      # which pnpm then runs in dependency order. Every dist/ here is generated
      # and gitignored, so a package whose tests read a sibling's build output
      # (the @poodle64/ui gates compile against @poodle64/design-tokens'
      # emitted stylesheets) finds nothing when only its own directory is
      # built. ci.yaml never caught this because `pnpm -r` already builds the
      # whole workspace in dependency order.
      - name: Build and test package
        run: pnpm --filter "{./${{ steps.pkg.outputs.dir }}}..." run test

      - name: Verify tag matches package version
        run: |
          set -e
          PKG_VERSION=$(node -p "require('./${{ steps.pkg.outputs.dir }}/package.json').version")
          if [ "$PKG_VERSION" != "${{ steps.pkg.outputs.version }}" ]; then
            echo "Tag version ${{ steps.pkg.outputs.version }} does not match ${{ steps.pkg.outputs.dir }}/package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
