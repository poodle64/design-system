name: Publish Package

# Publishes @poodle64/design-tokens to GitHub Packages on tag push.
# Deviation from 10-ci-workflow-standard (jobs on [self-hosted, atlas]),
# dated 2026-07-03: this repo is PUBLIC, and exposing a self-hosted runner
# to a public repo is a fork-PR execution risk. GitHub-hosted is the
# by-exception choice here, matching the public thoth repo.

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@poodle64'

      - name: Install
        run: pnpm install --frozen-lockfile

      # A tag can be cut from a commit that never went through ci.yaml, so the
      # emitted-contract guard runs here too rather than trusting the push gate.
      - name: Build and test tokens
        run: pnpm test

      - name: Verify tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag $TAG_VERSION does not match package.json version $PKG_VERSION" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
