name: Security

# Supply-chain and vulnerability scanning on every push and PR: secret scan
# (gitleaks), Node dependency audit (Trivy over the pnpm lockfile), and a
# Trivy filesystem scan. Pure-Node root: no Python audit/SBOM. All scan jobs
# live in the master-project factory reusable; this is the thin caller.
# master-project#169.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  security:
    name: Security checks
    uses: poodle64/master-project/.github/workflows/security-checks.yaml@main
    permissions:
      contents: read
      # gitleaks-action's ScanPullRequest lists the PR's commits via the
      # GitHub API to derive the scan range; without pull-requests: read it
      # 403s on pull_request events (push events use ScanPush and need
      # nothing extra).
      pull-requests: read
    with:
      python: false
      node-dir: '.'
